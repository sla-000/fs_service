# ==============================================================================
# Continuous Integration (CI) Workflow
# ==============================================================================
# Typical Code Verification & Development Flow:
# 1. Normal development is conducted on the `dev` branch.
# 2. Pushes or Pull Requests targeting `dev` (as well as `release/v*.*` and `main`)
#    automatically trigger this workflow.
# 3. Code verification steps executed in this pipeline:
#    - Code formatting check (`dart format`)
#    - Static code analysis (`dart analyze --fatal-infos`)
#    - Unit testing with coverage collection (`dart test`)
#    - LCOV formatting and coverage upload (Coveralls)
# 4. All checks must pass cleanly before merging code or publishing a release.
# ==============================================================================

name: CI

on:
  push:
    branches:
      - dev
      - 'release/v*.*'
  pull_request:
    branches:
      - dev
      - 'release/v*.*'

jobs:
  check:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: dart pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: dart analyze --fatal-infos

      - name: Run tests with coverage
        run: dart test --coverage=coverage

      - name: Format coverage report to LCOV
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage/lcov.info
